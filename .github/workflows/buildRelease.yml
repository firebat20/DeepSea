name: BuildRelease

on:
  push:
    branches:
      - master

permissions:
  contents: write

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - id: set-version
      run: |
        version=$(python -c 'import json; print(json.load(open("./settings.json", encoding="utf-8"))["releaseVersion"])')
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        if [ -f ../requirements.txt ]; then pip3 install -r ../requirements.txt; fi

    - name: Create DeepSea Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python ./start.py -gt="$GITHUB_TOKEN"

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        assets=()
        for asset in ./*.zip; do
          [ -f "$asset" ] && assets+=("$asset")
        done
        if [ ${#assets[@]} -eq 0 ]; then
          echo "No zip assets found to release!"
          exit 1
        fi
        gh release create "v${{ steps.set-version.outputs.version }}" "${assets[@]}" -d -t "Release v${{ steps.set-version.outputs.version }}" -n "Release v${{ steps.set-version.outputs.version }}"